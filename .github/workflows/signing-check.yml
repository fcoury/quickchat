name: Signing check
on:
  push:
    branches: [fix-release-keychain]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: ./scripts/build.sh release
      - name: Check signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db" /Library/Keychains/System.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security find-identity -v -p codesigning "$keychain"
          codesign --force --sign 'Developer ID Application: Felipe Coury (UXWHD5F6F4)' --keychain "$keychain" --options runtime --timestamp dist/QuickChat.app
          codesign --verify --deep --strict dist/QuickChat.app
