[changelog]
header = "# What's changed\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}### {{ group }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | upper_first }}
{% endfor %}
{% endfor %}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = ".*", group = "Other changes" },
]
sort_commits = "oldest"
